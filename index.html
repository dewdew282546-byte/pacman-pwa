<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10132a"><meta name="description" content="Maze Muncher offline maze arcade game"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><title>Maze Muncher · PWA</title><link rel="stylesheet" href="./style.css"></head><body><main class="layout"><header><h1>🟡 MAZE MUNCHER</h1><p>เกมเขาวงกตสไตล์ Pac-Man • ติดตั้งเป็นแอปได้</p></header><section class="panel"><div class="stats"><div>คะแนน <strong id="score">0</strong></div><div>ชีวิต <strong id="lives">3</strong></div><div>ด่าน <strong id="level">1</strong></div><div>สูงสุด <strong id="best">0</strong></div></div><div class="board-wrap"><canvas id="game" width="504" height="504" aria-label="เกมเขาวงกต"></canvas><div class="overlay" id="overlay"><div class="overlay-card"><h2 id="message">พร้อมเล่นหรือยัง?</h2><p id="detail">ใช้ปุ่มลูกศรหรือ WASD เพื่อเคลื่อนที่</p><button id="start">เริ่มเกม</button></div></div></div><div class="actions"><button id="pause">หยุดชั่วคราว</button><button id="restart">เริ่มใหม่</button><button id="install" hidden>ติดตั้งแอป</button></div><div class="dpad"><button data-direction="up">▲</button><div><button data-direction="left">◀</button><button data-direction="down">▼</button><button data-direction="right">▶</button></div></div></section><footer>กินจุดทั้งหมด • หลบผี • เก็บจุดพลังเพื่อกินผีชั่วคราว<br>Space เพื่อหยุดหรือเล่นต่อ · เกมต้นแบบอิสระ ไม่ใช่ผลิตภัณฑ์ทางการของ Pac-Man</footer></main><script defer src="./game.js"></script></body></html>
